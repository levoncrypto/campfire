name: Build Windows (staging + PR1295/1296/1298/1299)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: windows-staging-prs-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout upstream staging
        uses: actions/checkout@v4
        with:
          repository: cypherstack/stack_wallet
          ref: staging
          fetch-depth: 0
          submodules: recursive

      - name: Merge PRs onto staging
        shell: bash
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin pull/1295/head:pr-1295
          git fetch origin pull/1296/head:pr-1296
          git fetch origin pull/1298/head:pr-1298
          git fetch origin pull/1299/head:pr-1299

          git checkout -b build/staging-pr1295-1296-1298-1299

          git merge --no-ff --no-edit pr-1295
          git merge --no-ff --no-edit pr-1296
          git merge --no-ff --no-edit pr-1298
          git merge --no-ff --no-edit pr-1299

          git log --oneline -n 10

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          cache: true

      - name: Init submodules
        shell: bash
        run: |
          set -euxo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Disable frostdart DLL install in CI
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f crypto_plugins/frostdart/windows/CMakeLists.txt ]; then
            sed -i '/frostdart\.dll/d' crypto_plugins/frostdart/windows/CMakeLists.txt
          fi

      - name: Generate Stack Wallet config + generated files
        shell: bash
        run: |
          set -euxo pipefail
          source scripts/env.sh
          export BUILD_ISAR_FROM_SOURCE=0

          (cd scripts && bash prebuild.sh)
          source scripts/app_config/templates/configure_template_files.sh
          bash scripts/app_config/shared/update_version.sh -v 2.1.0 -b 1295129612981299
          bash scripts/app_config/configure_stack_wallet.sh

          # Disable MWEBD in CI via pubspec only
          sed -i 's/^[[:space:]]*flutter_mwebd:/#  flutter_mwebd:/' pubspec.yaml
          if grep -Eq '^[[:space:]]*flutter_mwebd:' pubspec.yaml; then
            echo "flutter_mwebd is still enabled"; exit 1
          fi

          # Regenerate interfaces without MWEBD
          dart tool/gen_interfaces.dart \
            tool/wl_templates \
            lib/wl_gen/generated \
            MWC XMR WOW SAL TOR EPIC FIRO XEL FROST

      - name: Create plugin git_versions.dart files
        shell: bash
        run: |
          set -euxo pipefail
          COMMIT="$(git log -1 --pretty=format:%H)"

          cp crypto_plugins/flutter_libepiccash/lib/git_versions_example.dart \
             crypto_plugins/flutter_libepiccash/lib/git_versions.dart
          cp crypto_plugins/flutter_libmwc/lib/git_versions_example.dart \
             crypto_plugins/flutter_libmwc/lib/git_versions.dart

          sed -i "s|/\\*WINDOWS_VERSION\\*/ const WINDOWS_VERSION = \"\"|/\\*WINDOWS_VERSION\\*/ const WINDOWS_VERSION = \"${COMMIT}\"|" \
            crypto_plugins/flutter_libepiccash/lib/git_versions.dart
          sed -i "s|/\\*WINDOWS_VERSION\\*/ const WINDOWS_VERSION = \"\"|/\\*WINDOWS_VERSION\\*/ const WINDOWS_VERSION = \"${COMMIT}\"|" \
            crypto_plugins/flutter_libmwc/lib/git_versions.dart

      - name: Prepare assets for Stack Wallet
        shell: pwsh
        run: |
          $dirs = @("default_themes","icon","lottie","in_app_logo_icons","svg")
          foreach ($d in $dirs) {
            $src = "asset_sources/$d/stack_wallet"
            $dst = "assets/$d"
            if (!(Test-Path $src)) { throw "Missing source assets directory: $src" }
            if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
            Copy-Item $src $dst -Recurse -Force
          }
          if (!(Test-Path "assets/lottie/loader.json")) {
            throw "Missing assets/lottie/loader.json after copy"
          }

      - name: Normalize Windows CMake flags
        shell: pwsh
        run: |
          $cm = "windows/CMakeLists.txt"
          if (Test-Path $cm) {
            $txt = Get-Content $cm -Raw
            $txt = [regex]::Replace($txt, 'set\(INCLUDE_EPIC_SO\s+[^\)]+\)', 'set(INCLUDE_EPIC_SO OFF)')
            $txt = [regex]::Replace($txt, 'set\(INCLUDE_MWC_SO\s+[^\)]+\)', 'set(INCLUDE_MWC_SO OFF)')
            Set-Content $cm $txt
          }

      # Keep your working runtime setup, but fix displayed/product identity
      # so existing Stack Wallet user-data is discovered on Windows.
      - name: Fix Windows app identity (without changing exe name)
        shell: bash
        run: |
          set -euxo pipefail

          sed -i 's/CreateAndShow(L"PlaceHolderName"/CreateAndShow(L"Stack Wallet"/' windows/runner/main.cpp

          sed -i 's/"FileDescription", "PlaceHolderName"/"FileDescription", "Stack Wallet"/' windows/runner/Runner.rc
          sed -i 's/"InternalName", "PlaceHolderName"/"InternalName", "Stack Wallet"/' windows/runner/Runner.rc
          sed -i 's/"ProductName", "PlaceHolderName"/"ProductName", "Stack Wallet"/' windows/runner/Runner.rc

      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get

      # Build secp in RELEASE mode (not Debug), avoid xcopy prompt.
      - name: Build secp256k1.dll (Release, non-interactive)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path build | Out-Null
          Push-Location build

          if (-not (Test-Path "secp256k1")) {
            git clone https://github.com/bitcoin-core/secp256k1
          }

          Push-Location secp256k1
          git checkout 68b55209f1ba3e6c0417789598f5f75649e9c14c
          git reset --hard

          cmake -G "Visual Studio 17 2022" -A x64 -S . -B build
          cmake --build build --config Release

          $dll = Join-Path (Get-Location) "build/bin/Release/libsecp256k1-2.dll"
          if (-not (Test-Path $dll)) { throw "libsecp256k1-2.dll not found: $dll" }

          Pop-Location # build/
          Copy-Item $dll "..\build\secp256k1.dll" -Force
          Copy-Item $dll "..\secp256k1.dll" -Force
          Pop-Location # repo root

          if (-not (Test-Path "build/secp256k1.dll")) { throw "build/secp256k1.dll missing" }
          if (-not (Test-Path "secp256k1.dll")) { throw "secp256k1.dll in repo root missing" }

      - name: Build Windows release (verbose)
        run: flutter build windows --release -v

      # CRITICAL: install secp into final Release after flutter build.
      - name: Copy secp256k1.dll to final Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $release = "build/windows/x64/runner/Release"
          if (-not (Test-Path $release)) { $release = "build/windows/runner/Release" }
          if (-not (Test-Path $release)) { throw "Release directory not found" }

          if (-not (Test-Path "build/secp256k1.dll")) { throw "build/secp256k1.dll not found" }

          Copy-Item "build/secp256k1.dll" (Join-Path $release "secp256k1.dll") -Force

          if (!(Test-Path (Join-Path $release "secp256k1.dll"))) {
            throw "secp256k1.dll missing in final Release after copy"
          }

      - name: Verify release output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $release = "build/windows/x64/runner/Release"
          if (-not (Test-Path $release)) { $release = "build/windows/runner/Release" }
          if (-not (Test-Path $release)) { throw "Release directory missing" }

          $exe = Get-ChildItem $release -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem $release -Force
            throw "No .exe found in Release"
          }

          foreach ($f in @("flutter_windows.dll","secp256k1.dll","xelis_flutter.dll")) {
            if (!(Test-Path (Join-Path $release $f))) {
              throw "$f missing in Release"
            }
          }

          $assetsDir = Join-Path $release "data\flutter_assets"
          if (!(Test-Path $assetsDir)) {
            throw "flutter_assets directory missing"
          }

          $hasManifest = $false
          foreach ($m in @("AssetManifest.json","AssetManifest.bin","AssetManifest.bin.json")) {
            if (Test-Path (Join-Path $assetsDir $m)) { $hasManifest = $true }
          }
          if (-not $hasManifest) { throw "No AssetManifest found" }

          Write-Host "Built EXE: $($exe.Name)"
          Get-ChildItem $release -Force

      - name: Zip release
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          if (-not (Test-Path $release)) { $release = "build/windows/runner/Release" }
          Compress-Archive -Path (Join-Path $release "*") -DestinationPath windows_build.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows_build_staging_pr1295_1296_1298_1299
          path: windows_build.zip

      - name: Runtime note
        shell: pwsh
        run: |
          Write-Host "If target machine still throws secp256k1 load error 126, install Microsoft VC++ Redistributable x64 (2015-2022) and run exe from unpacked folder with all DLLs/data."
