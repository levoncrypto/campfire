# Staging + merge PRs 1295/1296/1298/1299 → Windows release zip.
# secp256k1.dll is installed into Release ONLY AFTER flutter build.
# End-users may need VC++ 2015–2022 x64 to load secp (MSVC) on a clean Windows.
name: Windows build (staging + PRs 1295/1296/1298/1299)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: windows-build-staging-prs
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout upstream staging
        uses: actions/checkout@v4
        with:
          repository: cypherstack/stack_wallet
          ref: staging
          fetch-depth: 0
          submodules: recursive

      - name: Merge PRs onto staging
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin pull/1295/head:pr-1295
          git fetch origin pull/1296/head:pr-1296
          git fetch origin pull/1298/head:pr-1298
          git fetch origin pull/1299/head:pr-1299
          git checkout -b build/staging-pr1295-1296-1298-1299
          git merge --no-ff --no-edit pr-1295
          git merge --no-ff --no-edit pr-1296
          git merge --no-ff --no-edit pr-1298
          git merge --no-ff --no-edit pr-1299
          git log --oneline -n 10

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          cache: true

      - name: Init submodules
        shell: bash
        run: |
          set -euxo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Disable frostdart DLL install in CI
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f crypto_plugins/frostdart/windows/CMakeLists.txt ]; then
            sed -i '/frostdart\.dll/d' crypto_plugins/frostdart/windows/CMakeLists.txt
          fi

      - name: Generate Stack Wallet config + generated files
        shell: bash
        run: |
          set -euxo pipefail
          source scripts/env.sh
          export BUILD_ISAR_FROM_SOURCE=0
          (cd scripts && bash prebuild.sh)
          source scripts/app_config/templates/configure_template_files.sh
          bash scripts/app_config/shared/update_version.sh -v 2.1.0 -b 1295129612981299
          bash scripts/app_config/configure_stack_wallet.sh
          sed -i 's/^[[:space:]]*flutter_mwebd:/#  flutter_mwebd:/' pubspec.yaml
          if grep -Eq '^[[:space:]]*flutter_mwebd:' pubspec.yaml; then
            echo "flutter_mwebd is still enabled"; exit 1
          fi
          dart tool/gen_interfaces.dart \
            tool/wl_templates \
            lib/wl_gen/generated \
            MWC XMR WOW SAL TOR EPIC FIRO XEL FROST

      - name: Create plugin git_versions.dart files
        shell: bash
        run: |
          set -euxo pipefail
          COMMIT="$(git log -1 --pretty=format:%H)"
          cp crypto_plugins/flutter_libepiccash/lib/git_versions_example.dart \
             crypto_plugins/flutter_libepiccash/lib/git_versions.dart
          cp crypto_plugins/flutter_libmwc/lib/git_versions_example.dart \
             crypto_plugins/flutter_libmwc/lib/git_versions.dart
          sed -i "s|/\\*WINDOWS_VERSION\\*/ const WINDOWS_VERSION = \"\"|/\\*WINDOWS_VERSION\\*/ const WINDOWS_VERSION = \"${COMMIT}\"|" \
            crypto_plugins/flutter_libepiccash/lib/git_versions.dart
          sed -i "s|/\\*WINDOWS_VERSION\\*/ const WINDOWS_VERSION = \"\"|/\\*WINDOWS_VERSION\\*/ const WINDOWS_VERSION = \"${COMMIT}\"|" \
            crypto_plugins/flutter_libmwc/lib/git_versions.dart

      - name: Prepare assets for Stack Wallet
        shell: pwsh
        run: |
          $dirs = @("default_themes","icon","lottie","in_app_logo_icons","svg")
          foreach ($d in $dirs) {
            $src = "asset_sources/$d/stack_wallet"
            $dst = "assets/$d"
            if (!(Test-Path $src)) { throw "Missing source assets directory: $src" }
            if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
            Copy-Item $src $dst -Recurse -Force
          }
          if (!(Test-Path "assets/lottie/loader.json")) { throw "Missing assets/lottie/loader.json after copy" }

      - name: Normalize Windows CMake flags (no Epic/MWC SO)
        shell: pwsh
        run: |
          $cm = "windows/CMakeLists.txt"
          if (Test-Path $cm) {
            $txt = Get-Content $cm -Raw
            $txt = [regex]::Replace($txt, 'set\(INCLUDE_EPIC_SO\s+[^\)]+\)', 'set(INCLUDE_EPIC_SO OFF)')
            $txt = [regex]::Replace($txt, 'set\(INCLUDE_MWC_SO\s+[^\)]+\)', 'set(INCLUDE_MWC_SO OFF)')
            Set-Content $cm $txt
          }

      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get

      - name: Build secp256k1 (MSVC) and root copies for coinlib
        shell: cmd
        run: |
          call scripts\windows\build_secp256k1.bat
          if not exist "build\secp256k1.dll" ( echo build\secp256k1.dll missing & exit 1 )
          copy /Y "build\secp256k1.dll" "secp256k1.dll"
          if not exist "secp256k1.dll" ( echo secp256k1.dll in repo root missing & exit 1 )

      - name: Build Windows release
        run: flutter build windows --release -v

      - name: Install secp256k1.dll into final Release (after flutter build)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rel = "build/windows/x64/runner/Release"
          if (-not (Test-Path $rel)) { $rel = "build/windows/runner/Release" }
          if (-not (Test-Path $rel)) { throw "Release directory not found under build/windows" }
          $src = $null
          if (Test-Path "build/secp256k1.dll") { $src = (Resolve-Path "build/secp256k1.dll").Path }
          elseif (Test-Path "secp256k1.dll") { $src = (Resolve-Path "secp256k1.dll").Path }
          else {
            $f = Get-ChildItem "scripts/windows/build" -Recurse -Filter "libsecp256k1-2.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($f) { $src = $f.FullName }
          }
          if (-not $src) { throw "secp source DLL not found" }
          Write-Host "Copying secp from: $src"
          Copy-Item -LiteralPath $src -Destination (Join-Path $rel "secp256k1.dll") -Force
          Get-Item (Join-Path $rel "secp256k1.dll") | Format-List Name,Length,LastWriteTime

      - name: Verify release output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rel = "build/windows/x64/runner/Release"
          if (-not (Test-Path $rel)) { $rel = "build/windows/runner/Release" }
          $exe = Get-ChildItem $rel -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No .exe" }
          foreach ($req in @("flutter_windows.dll","secp256k1.dll","xelis_flutter.dll")) {
            if (!(Test-Path (Join-Path $rel $req))) { throw "Missing $req" }
          }
          $assetsDir = Join-Path $rel "data\flutter_assets"
          if (!(Test-Path $assetsDir)) { throw "flutter_assets directory missing" }
          $m = $false; foreach ($n in "AssetManifest.json","AssetManifest.bin","AssetManifest.bin.json") {
            if (Test-Path (Join-Path $assetsDir $n)) { $m = $true }
          }
          if (-not $m) { throw "No AssetManifest" }
          Get-ChildItem $rel -Force

      - name: Zip release
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          if (-not (Test-Path $rel)) { $rel = "build/windows/runner/Release" }
          Compress-Archive -Path (Join-Path $rel '*') -DestinationPath windows_build.zip -Force
          Get-Item windows_build.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows_build_staging_pr1295_1296_1298_1299
          path: windows_build.zip
